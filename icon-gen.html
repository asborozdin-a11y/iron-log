<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ICON GEN</title>
<style>body{background:#0a0d10;color:#e8eef2;font:16px monospace;padding:24px}button{font:700 18px monospace;padding:14px 22px;background:#ff2d43;border:0;color:#fff;border-radius:10px;cursor:pointer}#log{white-space:pre-wrap;margin-top:16px;color:#7d8b95}</style>
</head><body>
<h2>IRON WORLD · генератор PNG-иконок</h2>
<button id="go">Сгенерировать и скачать 4 файла</button>
<div id="log"></div>
<script>
function log(m){document.getElementById('log').textContent+=m+'\n';}
function draw(img,size,maskable){
 const c=document.createElement('canvas');c.width=size;c.height=size;
 const x=c.getContext('2d');
 x.fillStyle='#0a0d10';x.fillRect(0,0,size,size);
 const g=x.createRadialGradient(size/2,size/2,size*0.1,size/2,size/2,size*0.7);
 g.addColorStop(0,'rgba(255,45,67,0.35)');g.addColorStop(1,'rgba(255,45,67,0)');
 x.fillStyle=g;x.fillRect(0,0,size,size);
 const pad=maskable?size*0.2:size*0.08;
 const s=size-pad*2;
 x.drawImage(img,pad,pad,s,s);
 return c;
}
function dl(c,name){const a=document.createElement('a');a.download=name;a.href=c.toDataURL('image/png');a.click();}
document.getElementById('go').onclick=async()=>{
 log('читаю icon.svg…');
 const r=await fetch('icon.svg');
 const t=await r.text();
 const url=URL.createObjectURL(new Blob([t],{type:'image/svg+xml'}));
 const img=new Image();
 await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});
 log('svg загружен, рисую…');
 dl(draw(img,180,false),'icon-180.png');
 await new Promise(r=>setTimeout(r,400));
 dl(draw(img,192,false),'icon-192.png');
 await new Promise(r=>setTimeout(r,400));
 dl(draw(img,512,false),'icon-512.png');
 await new Promise(r=>setTimeout(r,400));
 dl(draw(img,512,true),'icon-maskable-512.png');
 log('готово: 4 файла в загрузках');
};
</script>
</body></html>
